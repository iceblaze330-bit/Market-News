<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketPulse — 美股財經新聞</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#0a0a0a;--ink2:#2a2826;--ink3:#6a6460;--paper:#f8f4ef;
  --paper2:#f0ebe3;--paper3:#e8e0d4;--accent:#c8390a;--accent2:#1a4a7a;
  --gold:#b8860b;--green:#1a6b3a;
  --serif:'Noto Serif TC',Georgia,serif;
  --body:'Noto Sans TC',sans-serif;
  --mono:'JetBrains Mono',monospace;
}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;min-height:100vh}
.masthead{background:var(--ink);color:var(--paper);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--accent)}
.logo{font-family:var(--serif);font-size:34px;font-weight:900;letter-spacing:-1px;color:#fff}
.logo span{color:var(--accent)}
.edition{font-family:var(--mono);font-size:12px;color:#aaa;letter-spacing:1px;margin-left:16px}
.ticker{display:flex;gap:24px;font-family:var(--mono);font-size:13px}
.tick{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.tick-sym{color:#aaa;font-size:11px;letter-spacing:1px}
.tick-val{color:#fff;font-weight:600;font-size:14px}
.tv-tape{background:#fff;border-bottom:1px solid var(--paper3);height:46px;overflow:hidden}
.tv-market-widget{background:#fff;border:1px solid var(--paper3);border-radius:4px;overflow:hidden;min-height:430px}
.tv-note{font-size:11px;color:var(--ink3);line-height:1.5;margin-top:8px}
.tradingview-widget-container{width:100%;height:100%}
.tradingview-widget-container__widget{width:100%;height:100%}
.up{color:#4caf50}.dn{color:#ef5350}
.subbar{background:var(--paper2);border-bottom:1px solid var(--paper3);padding:12px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.si{padding:9px 14px;border:1.5px solid var(--paper3);border-radius:4px;font-family:var(--body);font-size:15px;background:#fff;color:var(--ink);outline:none;width:280px}
.si:focus{border-color:var(--accent2)}
.sb{padding:9px 18px;background:var(--accent2);color:#fff;border:none;border-radius:4px;font-size:15px;font-family:var(--body);cursor:pointer;font-weight:500}
.sb:hover{opacity:.85}
.wl-label{font-family:var(--body);font-size:13px;color:var(--ink3);white-space:nowrap;font-weight:500}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag-btn{padding:5px 13px;border:1.5px solid var(--paper3);border-radius:20px;font-family:var(--body);font-size:13px;font-weight:500;cursor:pointer;background:#fff;color:var(--ink2);transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.tag-btn:hover{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.tag-btn:hover .rm-x{opacity:1}
.rm-x{opacity:0;font-size:15px;line-height:1;transition:opacity .15s}
.add-btn{padding:5px 10px;border:1.5px dashed var(--ink3);border-radius:20px;font-family:var(--body);font-size:13px;cursor:pointer;color:var(--ink3);background:transparent}
.add-btn:hover{border-color:var(--accent);color:var(--accent)}
.home-btn{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important;opacity:1!important}
.home-btn:hover{background:var(--accent)!important;border-color:var(--accent)!important}
/* 通知按鈕 */
.notif-btn{padding:7px 14px;border:1.5px solid var(--paper3);border-radius:4px;font-family:var(--body);font-size:13px;cursor:pointer;background:#fff;color:var(--ink2);display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap}
.notif-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.notif-btn.active{background:var(--green);color:#fff;border-color:var(--green)}
.notif-btn.active:hover{background:var(--accent)!important;border-color:var(--accent)!important}
.notif-btn.active:hover .notif-label-text::before{content:'關閉通知';position:absolute}
.notif-btn.denied{background:#eee;color:#aaa;cursor:not-allowed}
.notif-dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.layout{display:grid;grid-template-columns:1fr 290px;max-width:1200px;margin:0 auto}
.main-col{border-right:1px solid var(--paper3);padding:32px}
.side-col{padding:24px 20px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding-bottom:12px;border-bottom:2.5px solid var(--ink)}
.sec-title{font-family:var(--serif);font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.sec-line{flex:1;height:1px;background:var(--paper3)}
.live{font-family:var(--mono);font-size:10px;background:var(--accent);color:#fff;padding:3px 8px;border-radius:10px;letter-spacing:1px;animation:pb 2s ease-in-out infinite}
@keyframes pb{0%,100%{opacity:1}50%{opacity:.55}}
.cnt{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.ntag{font-family:var(--body);font-size:11px;letter-spacing:1.5px;font-weight:700;margin-bottom:8px;text-transform:uppercase}
.ntag.fed{color:var(--accent)}.ntag.earnings{color:var(--green)}.ntag.market{color:var(--accent2)}
.ntag.energy{color:var(--gold)}.ntag.crypto{color:#7b5ea7}.ntag.trade{color:#5a7a3a}.ntag.macro{color:#8a4a2a}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:2px;flex-shrink:0}
.dot.up{background:var(--green)}.dot.dn{background:#c8390a}.dot.neu{background:var(--gold)}
.meta{font-family:var(--body);font-size:12px;color:var(--ink3);margin-top:6px}
.hero-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:1px;background:var(--paper3);margin-bottom:1px}
.hero-main{background:var(--paper);padding:24px 28px 24px 0;cursor:pointer;transition:background .15s}
.hero-main:hover{background:var(--paper2)}
.hero-main h2{font-family:var(--serif);font-size:26px;font-weight:900;line-height:1.3;color:var(--ink);margin-bottom:12px}
.hero-excerpt{font-size:15px;color:var(--ink3);line-height:1.7;margin-bottom:12px}
.hero-stack{display:flex;flex-direction:column;gap:1px}
.mini{background:var(--paper);padding:16px 18px;cursor:pointer;transition:background .15s;border-left:3px solid transparent;flex:1;display:flex;flex-direction:column;justify-content:space-between}
.mini:hover{background:var(--paper2);border-left-color:var(--accent2)}
.mini h3{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.4;margin-bottom:6px;color:var(--ink)}
.card-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--paper3);margin-top:1px}
.card{background:var(--paper);padding:18px;cursor:pointer;transition:background .15s}
.card:hover{background:var(--paper2)}
.card h4{font-family:var(--serif);font-size:15px;font-weight:700;line-height:1.4;margin-bottom:8px;color:var(--ink)}
.list-wrap{margin-top:1px}
.list-row{background:var(--paper);border-bottom:1px solid var(--paper2);padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;transition:background .15s}
.list-row:hover{background:var(--paper2)}
.list-title{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.4;color:var(--ink)}
.list-src{font-family:var(--body);font-size:12px;color:var(--ink3);white-space:nowrap;margin-top:4px}
.tr-link{display:inline-flex;align-items:center;margin-left:8px;padding:1px 6px;border:1px solid var(--paper3);border-radius:4px;font-family:var(--body);font-size:11px;font-weight:500;color:var(--accent2);background:#fff;text-decoration:none;vertical-align:2px}
.tr-link:hover{border-color:var(--accent2);background:var(--paper2)}.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px}
.spinner{width:32px;height:32px;border:3px solid var(--paper3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltext{font-family:var(--body);font-size:15px;color:var(--ink3)}
.err-box{padding:24px;background:#fff8f6;border-left:4px solid var(--accent);border-radius:4px;margin:8px 0}
.err-title{font-family:var(--body);font-size:14px;color:var(--accent);font-weight:700;margin-bottom:8px}
.err-msg{font-size:14px;color:var(--ink2);line-height:1.7}
.retry{margin-top:12px;padding:8px 18px;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;font-family:var(--body);font-size:14px;font-weight:500}
.sw{margin-bottom:32px}
.sw-title{font-family:var(--body);font-size:11px;letter-spacing:2px;color:var(--ink3);font-weight:700;padding-bottom:10px;border-bottom:1px solid var(--paper3);margin-bottom:14px;text-transform:uppercase}
.wi{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--paper2);cursor:pointer}
.wi:hover{background:var(--paper2)}
.wsym{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent2)}
.wname{font-size:12px;color:var(--ink3);margin-top:2px}
.wprice{font-family:var(--mono);font-size:15px;font-weight:600}
.wchg{font-family:var(--mono);font-size:12px;margin-top:2px}
.sni{padding:12px 0;border-bottom:1px solid var(--paper2);display:block;text-decoration:none;color:inherit}
.snt{font-family:var(--serif);font-size:14px;font-weight:600;line-height:1.45;margin-bottom:4px;transition:color .15s;color:var(--ink)}
.sni:hover .snt{color:var(--accent2)}
.snm{font-family:var(--body);font-size:12px;color:var(--ink3)}
.footer{font-family:var(--body);font-size:12px;color:var(--ink3);text-align:center;padding:16px;border-top:1px solid var(--paper3);margin-top:4px}
/* 通知 toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:14px 20px;border-radius:8px;font-family:var(--body);font-size:14px;max-width:320px;line-height:1.5;z-index:999;transform:translateY(100px);opacity:0;transition:all .3s;border-left:4px solid var(--green)}
.toast.show{transform:translateY(0);opacity:1}
/* Modal */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.mo.open{display:flex}
.mb{background:#fff;padding:28px;border-radius:6px;width:340px;border-top:4px solid var(--accent)}
.mt{font-family:var(--serif);font-size:20px;font-weight:700;margin-bottom:18px}
.mi{width:100%;padding:10px 14px;border:1.5px solid var(--paper3);border-radius:4px;font-family:var(--mono);font-size:16px;text-transform:uppercase;outline:none;margin-bottom:14px}
.mi:focus{border-color:var(--accent2)}
.mbtns{display:flex;gap:10px;justify-content:flex-end}
.bc{padding:8px 16px;border:1.5px solid var(--paper3);border-radius:4px;background:#fff;cursor:pointer;font-size:14px;font-family:var(--body)}
.bok{padding:8px 18px;border:none;border-radius:4px;background:var(--accent2);color:#fff;cursor:pointer;font-size:14px;font-family:var(--body);font-weight:500}
@media(max-width:900px){
  .layout{grid-template-columns:1fr}.side-col{display:none}
  .hero-grid{grid-template-columns:1fr}.hero-stack{display:none}
  .card-row{grid-template-columns:1fr 1fr}
  .edition{display:none}
  .main-col{padding:20px}
}
</style>
</head>

<script>
// ── 日期 ──
const now = new Date();
document.getElementById('ed').textContent =
  ' · ' + now.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});

// ── 資料 ──
const MOCK={SPY:{p:589.24,c:0.58},NVDA:{p:224.18,c:1.78},AAPL:{p:211.45,c:-0.43},TSLA:{p:178.2,c:-1.15},MSFT:{p:422.8,c:0.68},META:{p:534.6,c:1.23},AMZN:{p:196.35,c:-0.71},GOOGL:{p:178.9,c:0.34},QQQ:{p:488.75,c:1.41}};
let watchlist;
try{
  watchlist = JSON.parse(localStorage.getItem('mp_wl')||'["SPY","NVDA","AAPL","TSLA","MSFT"]');
  if(!Array.isArray(watchlist)) throw new Error('Invalid watchlist');
}catch{
  watchlist = ["SPY","NVDA","AAPL","TSLA","MSFT"];
}
let currentQ = '';
let swReg = null;
let swMessageBound = false;
const API_BASE = window.MP_API_BASE || '';
const SYMBOL_RE = /^[A-Z][A-Z0-9.-]{0,9}$/;

function saveWL(){ localStorage.setItem('mp_wl', JSON.stringify(watchlist)); }

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));
}

function safeUrl(url){
  try{
    const u = new URL(url || '#', location.href);
    return ['http:', 'https:', 'mailto:'].includes(u.protocol) ? u.href : '#';
  }catch{
    return '#';
  }
}

function newsEndpoint(q){
  const base = API_BASE.replace(/\/$/, '');
  return `${base}/api/news?q=${encodeURIComponent(q)}`;
}

function safeSymbol(v){
  return String(v || '').trim().toUpperCase();
}

// ── Toast 通知 ──
function showToast(msg, duration=4000){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), duration);
}

// ── Service Worker 初始化 ──
async function initSW(){
  if(!('serviceWorker' in navigator)) return;
  try{
    swReg = await navigator.serviceWorker.register('./sw.js');
    console.log('[SW] registered');

    // 接收 SW 傳回的開啟網址指令
    if(!swMessageBound){
      navigator.serviceWorker.addEventListener('message', e=>{
        if(e.data.type==='OPEN_URL') window.open(safeUrl(e.data.url),'_blank','noopener,noreferrer');
      });
      swMessageBound = true;
    }

    updateNotifBtn();
  }catch(e){ console.warn('[SW] register failed:', e); }
}

// ── 通知開關狀態（獨立於瀏覽器權限）──
let notifEnabled = JSON.parse(localStorage.getItem('mp_notif') || 'false');

function updateNotifBtn(){
  const btn = document.getElementById('notif-btn');
  const label = document.getElementById('notif-label');
  const perm = Notification.permission;
  if(perm === 'denied'){
    btn.className = 'notif-btn denied';
    label.textContent = '通知已封鎖';
  } else if(perm === 'granted' && notifEnabled){
    btn.className = 'notif-btn active';
    label.textContent = '通知已開啟';
    btn.title = '點擊關閉通知';
    btn.onmouseenter = ()=>{ label.textContent = '關閉通知'; };
    btn.onmouseleave = ()=>{ label.textContent = '通知已開啟'; };
  } else {
    btn.className = 'notif-btn';
    label.textContent = '開啟通知';
    btn.title = '';
    btn.onmouseenter = null;
    btn.onmouseleave = null;
  }
}

async function toggleNotif(){
  if(!('Notification' in window)){
    showToast('⚠ 此瀏覽器不支援通知功能');
    return;
  }
  if(Notification.permission === 'denied'){
    showToast('⚠ 通知已被封鎖，請至瀏覽器設定手動開啟');
    return;
  }
  // 已開啟 → 關閉
  if(Notification.permission === 'granted' && notifEnabled){
    notifEnabled = false;
    localStorage.setItem('mp_notif', 'false');
    // 停止 SW 監控
    if(swReg?.active) swReg.active.postMessage({ type:'STOP_WATCH' });
    updateNotifBtn();
    showToast('🔕 通知已關閉');
    return;
  }
  // 未開啟 → 請求並開啟
  const perm = Notification.permission === 'granted'
    ? 'granted'
    : await Notification.requestPermission();
  if(perm === 'granted'){
    notifEnabled = true;
    localStorage.setItem('mp_notif', 'true');
    updateNotifBtn();
    showToast('✅ 通知已開啟！追蹤股票有新消息時會自動通知你');
    sendWatchlistToSW();
    if(swReg && 'periodicSync' in swReg){
      try{ await swReg.periodicSync.register('news-check',{minInterval:30*60*1000}); }catch{}
    }
  } else {
    showToast('❌ 未授予通知權限');
  }
  updateNotifBtn();
}

function sendWatchlistToSW(){
  if(!swReg || !swReg.active) return;
  swReg.active.postMessage({ type: 'START_WATCH', watchlist });
}

// ── Watchlist ──
function removeWL(s, e){
  e.stopPropagation();
  watchlist = watchlist.filter(w=>w!==s);
  saveWL(); renderWL();
  if(swReg?.active) swReg.active.postMessage({ type:'UPDATE_WATCHLIST', watchlist });
  if(currentQ===s) clearQ();
}

function renderWL(){
  watchlist = watchlist.map(safeSymbol).filter(s=>SYMBOL_RE.test(s));
  saveWL();
  document.getElementById('wl-tags').innerHTML =
    watchlist.map(s=>`<button class="tag-btn" onclick="setQ('${esc(s)}')">
      ${esc(s)}<span class="rm-x" onclick="removeWL('${esc(s)}',event)" title="移除">×</span>
    </button>`).join('') +
    `<button class="tag-btn home-btn" onclick="clearQ()">📰 今日財經頭條</button>`;
  const pricesEl=document.getElementById('prices'); if(pricesEl) pricesEl.innerHTML = watchlist.map(s=>{
    const r=MOCK[s]||{p:(100+Math.random()*300),c:((Math.random()*6)-3)};
    const u=r.c>=0;
    return`<div class="wi" onclick="setQ('${esc(s)}')">
      <div><div class="wsym">${esc(s)}</div><div class="wname">點擊篩選新聞</div></div>
      <div style="text-align:right">
        <div class="wprice">$${r.p.toFixed(2)}</div>
        <div class="wchg ${u?'up':'dn'}">${u?'▲':'▼'}${Math.abs(r.c).toFixed(2)}%</div>
      </div>
    </div>`;}).join('');
}

// ── 標籤/情緒 ──
function getTagKey(t){
  const s=t.toLowerCase();
  if(/聯準會|升息|降息|通膨|fed|fomc|powell|warsh|利率|殖利率|treasury/.test(s))return'fed';
  if(/財報|獲利|營收|eps|earnings|profit|revenue|guidance/.test(s))return'earnings';
  if(/比特幣|加密|bitcoin|crypto|btc|eth/.test(s))return'crypto';
  if(/中國|貿易|關稅|china|trade|tariff/.test(s))return'trade';
  if(/石油|原油|能源|oil|energy|crude|wti|opec/.test(s))return'energy';
  if(/gdp|失業|就業|衰退|recession|unemployment/.test(s))return'macro';
  return'market';
}
const TL={fed:'FED/政策',earnings:'財報',market:'市場',energy:'能源',crypto:'加密貨幣',trade:'貿易',macro:'總經'};
function tl(k){return TL[k]||'市場';}
function isLikelyEnglish(text){
  const s = String(text || '');
  const latin = (s.match(/[A-Za-z]/g) || []).length;
  const cjk = (s.match(/[\u3400-\u9fff]/g) || []).length;
  return latin >= 12 && latin > cjk * 2;
}

function translateUrl(text){
  return `https://translate.google.com/?sl=auto&tl=zh-TW&text=${encodeURIComponent(text)}&op=translate`;
}

function translateLink(title){
  if(!isLikelyEnglish(title)) return '';
  return `<a class="tr-link" href="${esc(translateUrl(title))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">&#32763;&#35695;</a>`;
}
function sent(t){
  const s=t.toLowerCase();
  if(/上漲|大漲|飆漲|創高|超越|優於|surges?|jumps?|rallies?|gains?|beats?|record|rises?|climbs?|soars?|bullish/.test(s))return'up';
  if(/下跌|大跌|崩跌|低於|衰退|falls?|drops?|slumps?|declines?|miss|weak|crash|bearish|cuts?|warns?|fears?/.test(s))return'dn';
  return'neu';
}
function ago(pub){
  try{
    const d=Math.floor((new Date()-new Date(pub))/60000);
    if(d<60)return d+'分鐘前';
    if(d<1440)return Math.floor(d/60)+'小時前';
    return Math.floor(d/1440)+'天前';
  }catch{return '';}
}
function card(url,inner){
  const safe=esc(safeUrl(url));
  return`<a href="${safe}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit;display:block">${inner}</a>`;
}

// ── 抓新聞 ──
async function fetchNews(query){
  const area=document.getElementById('news-area');
  area.innerHTML=`<div class="loading"><div class="spinner"></div><div class="ltext">載入「${esc(query||'財經頭條')}」新聞…</div></div>`;
  document.getElementById('cnt').textContent='';
  const q=query||'美股 經濟 財經';
  try{
    const res=await fetch(newsEndpoint(q),{signal:AbortSignal.timeout(12000)});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data=await res.json();
    if(!data.ok) throw new Error(data.error||'API 錯誤');
    if(!data.items.length) throw new Error('找不到新聞');
    render(data.items);
    renderSide(data.items.slice(0,6));
    document.getElementById('cnt').textContent=data.items.length+' 則';
    document.getElementById('footer').textContent='資料來源：Google News · 更新：'+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    area.innerHTML=`<div class="err-box">
      <div class="err-title">⚠ 無法載入新聞</div>
      <div class="err-msg">錯誤：${esc(e.message)}</div>
      <button class="retry" id="retry-news">重新嘗試</button>
    </div>`;
    document.getElementById('retry-news').addEventListener('click',()=>fetchNews(query||''));
  }
}

function normalizeArticle(a){
  return {
    title: String(a?.title || '未命名新聞').trim(),
    link: safeUrl(a?.link),
    source: String(a?.source || 'Google News').trim(),
    pubDate: a?.pubDate || ''
  };
}

function render(arts){
  arts = arts.map(normalizeArticle);
  const [h,...rest]=arts;
  const stack=rest.slice(0,3),grid=rest.slice(3,9),list=rest.slice(9);
  document.getElementById('news-area').innerHTML=`
    <div class="hero-grid">
      ${card(h.link,`<div class="hero-main">
        <div class="ntag ${getTagKey(h.title)}">${tl(getTagKey(h.title))}</div>
        <h2><span class="dot ${sent(h.title)}"></span>${esc(h.title)}${translateLink(h.title)}</h2>
        <div class="hero-excerpt">點擊閱讀完整報導 → ${esc(h.source)}</div>
        <div class="meta">${esc(h.source)} · ${esc(ago(h.pubDate))}</div>
      </div>`)}
      <div class="hero-stack">
        ${stack.map(a=>card(a.link,`<div class="mini">
          <div>
            <div class="ntag ${getTagKey(a.title)}" style="margin-bottom:5px">${tl(getTagKey(a.title))}</div>
            <h3><span class="dot ${sent(a.title)}"></span>${esc(a.title)}${translateLink(a.title)}</h3>
          </div>
          <div class="meta">${esc(a.source)} · ${esc(ago(a.pubDate))}</div>
        </div>`)).join('')}
      </div>
    </div>
    ${grid.length?`<div class="card-row">
      ${grid.map(a=>card(a.link,`<div class="card">
        <div class="ntag ${getTagKey(a.title)}" style="margin-bottom:7px">${tl(getTagKey(a.title))}</div>
        <h4><span class="dot ${sent(a.title)}"></span>${esc(a.title)}${translateLink(a.title)}</h4>
        <div class="meta">${esc(a.source)} · ${esc(ago(a.pubDate))}</div>
      </div>`)).join('')}
    </div>`:''}
    ${list.length?`<div class="list-wrap">
      ${list.map(a=>card(a.link,`<div class="list-row">
        <div>
          <div class="ntag ${getTagKey(a.title)}" style="margin-bottom:4px">${tl(getTagKey(a.title))}</div>
          <div class="list-title"><span class="dot ${sent(a.title)}"></span>${esc(a.title)}${translateLink(a.title)}</div>
        </div>
        <div style="text-align:right;min-width:80px">
          <div class="list-src">${esc(a.source)}</div>
          <div class="list-src">${esc(ago(a.pubDate))}</div>
        </div>
      </div>`)).join('')}
    </div>`:''}
  `;
}

function renderSide(arts){
  arts = arts.map(normalizeArticle);
  document.getElementById('side-news').innerHTML=arts.map(a=>
    card(a.link,`<div class="sni">
      <div class="snt"><span class="dot ${sent(a.title)}"></span>${esc(a.title)}${translateLink(a.title)}</div>
      <div class="snm">${esc(a.source)} · ${esc(ago(a.pubDate))}</div>
    </div>`)
  ).join('');
}

// ── 搜尋控制 ──
function setQ(q){currentQ=q;document.getElementById('feed-label').textContent=q+' 新聞';document.getElementById('q').value=q;fetchNews(q);}
function clearQ(){currentQ='';document.getElementById('feed-label').textContent='今日財經頭條';document.getElementById('q').value='';fetchNews('');}
function doSearch(){const v=document.getElementById('q').value.trim();if(v)setQ(v);else clearQ();}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

// ── Modal ──
function openM(){document.getElementById('modal').classList.add('open');document.getElementById('mi').focus();}
function closeM(){document.getElementById('modal').classList.remove('open');document.getElementById('mi').value='';}
function confirmAdd(){
  const v=safeSymbol(document.getElementById('mi').value);
  if(v && !SYMBOL_RE.test(v)){
    showToast('請輸入有效的股票代號，例如 NVDA、BRK.B 或 BTC-USD');
    return;
  }
  if(v&&!watchlist.includes(v)){
    watchlist.push(v);saveWL();renderWL();
    if(swReg?.active) swReg.active.postMessage({type:'UPDATE_WATCHLIST',watchlist});
  }
  closeM();if(v)setQ(v);
}
document.getElementById('mi').addEventListener('keydown',e=>{if(e.key==='Enter')confirmAdd();if(e.key==='Escape')closeM();});
document.getElementById('modal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeM();});

// ── 啟動 ──
renderWL();
fetchNews('');
initSW();
if(Notification.permission==='granted' && notifEnabled){
  initSW().then(()=>{ setTimeout(sendWatchlistToSW, 1000); });
}
setInterval(()=>fetchNews(currentQ), 10*60*1000);
</script>
